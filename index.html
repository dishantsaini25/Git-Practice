
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Header</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4">

      <div class="flex items-center justify-between">

        <!-- Logo -->
        <div class="text-2xl font-bold text-blue-600">
          Brand<span class="text-gray-800">Name</span>
        </div>

        <!-- Navigation -->
        <nav class="hidden md:flex items-center gap-8">

          <a href="#" class="text-gray-700 hover:text-blue-600 font-medium">
            Home
          </a>

          <a href="#" class="text-gray-700 hover:text-blue-600 font-medium">
            About
          </a>

          <a href="#" class="text-gray-700 hover:text-blue-600 font-medium">
            Services
          </a>

          <a href="#" class="text-gray-700 hover:text-blue-600 font-medium">
            Portfolio
          </a>

          <a href="contact.html" class="text-gray-700 hover:text-blue-600 font-medium">
            Contact
          </a>

        </nav>

        <!-- CTA Button -->
        <button class="hidden md:block bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700">
          Get Started
        </button>

        <!-- Mobile Menu Button -->
        <button class="md:hidden text-2xl text-gray-800">
          ☰
        </button>

      </div>
    </div>
  </header>

</body>
</html>
